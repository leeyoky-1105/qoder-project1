<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}基金TA注册系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f7fa; }
        .navbar { background-color: #1a237e !important; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .btn-primary { background-color: #1a237e; border-color: #1a237e; }
        .btn-primary:hover { background-color: #283593; border-color: #283593; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">基金TA模拟系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/api/v1/accounts/register">开户注册</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/api/v1/trades/subscribe">基金申购</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/api/v1/trades/redeem">基金赎回</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/api/v1/shares/query">份额查询</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/api/v1/reconciliation/report">对账报告</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="container mt-5 mb-3 text-center text-muted">
        <hr>
        <p>基金TA模拟系统 - 仅供学习演示使用</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
